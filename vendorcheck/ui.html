<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payables Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=3">
<style>
#cam{width:100%;max-width:640px;display:block;background:#000;border-radius:6px}
.scanph{position:relative;align-self:start}.scanph img{width:100%;display:block;border-radius:4px}
.scanph i{position:absolute;outline:2px solid #384ce3;background:rgba(56,76,227,.14);border-radius:2px}
.scangrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:800px){.scangrid{grid-template-columns:1fr}}
/* four-section layout */
.tshell{display:flex;flex-direction:column;height:100%}
.thead{height:52px;flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.thead .brand{padding:0;font-size:14px}
.ttabs{display:flex;gap:2px;height:100%}
.ttabs a{position:relative;display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--fg-2);font-weight:500;cursor:pointer;transition:color var(--fast)}
.ttabs a:hover{color:var(--fg)}
.ttabs a.on{color:var(--fg)}
.ttabs a.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--blue);border-radius:2px}
.ttabs .cnt{font:500 11px var(--mono);color:var(--fg-3);background:var(--bg-sub);border:1px solid var(--line);border-radius:9px;padding:0 6px}
.ttabs .cnt.hot{color:#fff;background:var(--blue);border-color:var(--blue)}
.tright{margin-left:auto;display:flex;gap:8px;align-items:center}
.tright .kbtn{margin:0;width:auto;height:30px}
.me2{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 4px;border:1px solid var(--line-2);border-radius:15px;background:var(--bg);font:500 12px var(--sans);color:var(--fg-2);cursor:pointer}
.me2:hover{border-color:var(--fg-3)}
.top{padding:0 24px}
.view{width:100%}
.view>*{max-width:1180px;margin-left:auto;margin-right:auto}
.view.flush>*{max-width:none}
.narrow{max-width:760px!important}
.greet .d{color:var(--fg-3);font-size:13px}
.greet h2{font:400 34px/1.15 "PP Mondwest",Georgia,serif;margin:4px 0 20px;letter-spacing:-.01em}
@font-face{font-family:"PP Mondwest";src:local("PP Mondwest"),url("/static/PPMondwest-Regular.otf") format("opentype");font-display:swap}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:22px;display:flex;align-items:center;gap:18px;background:var(--bg-sub);transition:border-color var(--fast),background var(--fast);margin-bottom:12px}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .ico{width:44px;height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.drop b{display:block;font-size:15px}.drop span{color:var(--fg-3);font-size:13px}
.drop .go{margin-left:auto;display:flex;gap:8px}
.minor{display:flex;gap:14px;font-size:12px;color:var(--fg-3);margin:0 0 22px}.minor a{cursor:pointer;color:var(--fg-2)}.minor a:hover{color:var(--blue)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.kc{border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;transition:border-color var(--fast),transform var(--fast)}
.kc:hover{border-color:var(--fg-3);transform:translateY(-1px)}
.kc .v{font:500 24px/1.2 var(--sans);margin-top:6px;font-variant-numeric:tabular-nums}.kc .s{font-size:12px;color:var(--fg-3)}
.today{border-top:1px solid var(--line)}
.td{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--fast)}
.td:hover{background:var(--bg-hover)}
.td .tk{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:50%;flex:none}
.td .grow{flex:1;min-width:0}.td .grow small{display:block;color:var(--fg-3)}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ins .bd{padding:14px}
.hbar{display:grid;grid-template-columns:150px 1fr 100px;gap:10px;align-items:center;font-size:12px;margin:8px 0}
.hbar .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--blue);border-radius:4px}
.big{font:500 30px/1.1 var(--sans);font-variant-numeric:tabular-nums}
@media(max-width:900px){.kgrid{grid-template-columns:1fr 1fr}.ins{grid-template-columns:1fr}.ttabs a{padding:0 8px}.thead .brand{display:none}}
/* efferd-style blocks, rebuilt natively */
.blk{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.blk>.bh{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.blk>.bh h3{margin:0;font-size:14px;font-weight:600}
.blk>.bh .sub{display:block;color:var(--fg-3);font-size:12px;font-weight:400}
.blk>.bh .rt{margin-left:auto;display:flex;gap:6px}
.blk>.bb{padding:12px 16px 16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);font:500 12px var(--sans);color:var(--fg-2);padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--fg);color:#fff}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.strip>div{padding:14px 16px;border-right:1px solid var(--line)}.strip>div:last-child{border-right:0}
.strip .v{font:500 22px/1.2 var(--sans);margin-top:4px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:3px;font:500 11px var(--mono);padding:1px 6px;border-radius:9px;margin-left:6px;vertical-align:middle}
.delta.up{color:var(--paid);background:var(--paid-soft)}.delta.dn{color:var(--bad);background:var(--bad-soft)}.delta.nt{color:var(--fg-3);background:var(--bg-sub)}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{font:500 11px var(--mono);color:var(--fg-3)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alert:last-child{border-bottom:0}.alert:hover .t{color:var(--blue)}
.alert .t{font-weight:500}.alert small{display:block;color:var(--fg-3)}
.donut{display:flex;gap:16px;align-items:center}
.leg{display:grid;gap:6px;font-size:12px}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line-2);box-shadow:var(--shadow-pop);z-index:40;transform:translateX(100%);transition:transform var(--slow) var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.tier{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:2px 8px;border-radius:10px;border:1px solid}
.tier.low{color:var(--paid);border-color:#bfe3d3;background:var(--paid-soft)}.tier.med{color:var(--held);border-color:#f0d5a8;background:var(--held-soft)}.tier.high{color:var(--bad);border-color:#efc2bc;background:var(--bad-soft)}.tier.na{color:var(--fg-3);border-color:var(--line-2)}
@media(max-width:900px){.g2,.g3,.strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tshell">
  <header class="thead">
    <div class="brand"><svg width="20" height="18" viewBox="0 0 26 22" fill="none" stroke="#384ce3" stroke-width="2"><path d="M13 2 24 7 13 12 2 7z"/><path d="M2 11.5 13 16.5 24 11.5"/><path d="M2 15.5 13 20.5 24 15.5"/></svg>Payables Desk</div>
    <nav class="ttabs" id="nav"></nav>
    <div class="tright"><button class="kbtn" id="kopen" aria-label="Open command palette"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<span class="kbd">⌘K</span></button>
      <button class="me2" id="setme" title="Approver and settings"><span class="avatar" id="av">·</span><span id="who">…</span></button></div>
  </header>
  <div class="top" id="top"></div>
  <div class="view" id="view"></div>
</div>
<div class="drawer" id="drawer" role="dialog" aria-label="Vendor details"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Command palette"><div class="bx"><input id="pq" placeholder="Type a command or search documents…" autocomplete="off"><div class="res" id="pres"></div></div></div>

<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const V=$('#view'), TOP=$('#top');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>n==null?'—':'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ago=t=>{if(!t)return '—';const s=Date.now()/1000-t;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return new Date(t*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const tsf=t=>t?new Date(t*1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const nice=s=>String(s||'').replace(/_/g,' ');
const CHK={classify:'Document type',vendor_identified:'Vendor identified',duplicate:'Duplicate check',sender_domain:'Sender domain',gstin_binding:'GSTIN binding',three_way_match:'3-way match',bank_details:'Bank account',vendor_trust:'Vendor check',bank_change:'Bank-detail change',payable:'Payable document'};
const chkName=k=>CHK[k]||nice(k);

/* status icons: shape + colour, never colour alone */
const ICON={
 paid:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M4.2 7.2 6.1 9l3.7-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
 awaiting_approval:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 0 1 7 12.5Z" fill="currentColor"/></svg>',
 approved:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 1 1 1.5 7H7Z" fill="currentColor"/></svg>',
 held:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="4.2" width="1.3" height="5.6" fill="currentColor"/><rect x="7.7" y="4.2" width="1.3" height="5.6" fill="currentColor"/></svg>',
 duplicate:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m3.2 10.8 7.6-7.6" stroke="currentColor" stroke-width="1.5"/></svg>',
 rejected:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="m4.6 4.6 4.8 4.8M9.4 4.6 4.6 9.4" stroke="#fff" stroke-width="1.5"/></svg>',
 pass:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#1f8a63"/><path d="M4.2 7.2 6.1 9l3.7-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
 warn:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#c27a12"/><rect x="6.3" y="3.4" width="1.4" height="4.6" fill="#fff"/><rect x="6.3" y="9.2" width="1.4" height="1.4" fill="#fff"/></svg>',
 fail:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#c03a2b"/><path d="m4.6 4.6 4.8 4.8M9.4 4.6 4.6 9.4" stroke="#fff" stroke-width="1.5"/></svg>',
 unavailable:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#c03a2b" stroke-width="1.5" stroke-dasharray="2 2"/></svg>',
 none:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#8a90a0" stroke-width="1.5" stroke-dasharray="2 2"/></svg>'};
const LBL={paid:'Paid',awaiting_approval:'Needs approval',approved:'Approved',held:'Held',duplicate:'Duplicate',rejected:'Rejected'};
const st=s=>`<span class="st ${s}" title="${esc(LBL[s]||nice(s))}">${ICON[s]||ICON.none}<span class="t">${esc(LBL[s]||nice(s))}</span></span>`;
const pill=(r,label)=>`<span class="pill ${r}">${esc(label||r)}</span>`;

/* toasts */
function toast(msg,kind='ok'){const t=document.createElement('div');t.className='toast '+kind;
  t.innerHTML=(kind==='err'?'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/></svg>':'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 8.5 3 3 7-7"/></svg>')+`<div>${msg}</div>`;
  $('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)},3200)}
/* button loading state */
async function busy(btn,label,fn){const html=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${label}`;try{return await fn()}catch(e){toast(esc(e.message),'err')}finally{if(document.body.contains(btn)){btn.disabled=false;btn.innerHTML=html}}}
/* copy to clipboard with inline confirmation */
function bindCopy(root=document){root.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async e=>{e.stopPropagation();
  try{await navigator.clipboard.writeText(el.dataset.copy)}catch{};const o=el.textContent;el.classList.add('ok');el.textContent='Copied';setTimeout(()=>{el.classList.remove('ok');el.textContent=o},1200)})}
/* count-up numbers */
function countUp(root=document){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,fmt=el.dataset.fmt;const f=n=>fmt==='inr'?inr(n):Math.round(n);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!to){el.textContent=f(to);return}
  const t0=performance.now(),d=600;(function step(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)})(t0)})}
const skel=(n=6)=>`<div class="tblwrap"><table class="tbl"><tbody>${Array.from({length:n},(_,i)=>`<tr><td><div class="skel" style="width:${45+((i*37)%45)}%"></div></td><td><div class="skel" style="width:60%"></div></td><td><div class="skel" style="width:30%"></div></td></tr>`).join('')}</tbody></table></div>`;

/* ============ auth + api ============ */
let ME=null, INV=[];
async function api(p,b){const h={'content-type':'application/json'};
  const r=await fetch(p,b?{method:'POST',headers:h,body:JSON.stringify(b)}:{headers:h});
  const j=await r.json(); if(j&&j.error&&r.status>=400)throw new Error(j.error); return j}

/* ============ navigation ============ */
const IC={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7H2v-7z"/>',
 appr:'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>',vend:'<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>',
 check:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',bank:'<path d="M3 10h18M5 10v8M9 10v8M15 10v8M19 10v8M2 21h20M12 3l9 5H3z"/>',
 led:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',log:'<path d="M4 6h16M4 12h16M4 18h10"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const SCREENS=[
 {id:'dash',t:'Dashboard',k:'d',tab:1},{id:'vendors',t:'Vendors',k:'v',tab:1},{id:'inbox',t:'Payments',k:'p',tab:1},{id:'insights',t:'Insights',k:'i',tab:1},
 {id:'ledger',t:'Ledger',k:'l'},{id:'bank',t:'Bank lines',k:'b'},{id:'vcheck',t:'Check a vendor',k:'c'},{id:'activity',t:'Activity',k:'y'},{id:'settings',t:'Settings',k:'s'}];
const TABOF={dash:'dash',vendors:'vendors',vcheck:'vendors',inbox:'inbox',case:'inbox',ledger:'inbox',bank:'inbox',approvals:'inbox',insights:'insights',activity:'insights',settings:''};
let ROUTE={id:'dash'};
function drawNav(){const w=INV.filter(r=>r.state==='awaiting_approval').length,h=INV.filter(r=>r.state==='held').length;
  const cnt={inbox:w+h};const on=TABOF[ROUTE.id];
  $('#nav').innerHTML=SCREENS.filter(s=>s.tab).map(s=>`<a data-r="${s.id}" class="${on===s.id?'on':''}" title="g then ${s.k}">${s.t}${cnt[s.id]?`<span class="cnt ${w?'hot':''}">${cnt[s.id]}</span>`:''}</a>`).join('');
  $$('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.r))}
function topbar(title,{crumb,acts=''}={}){TOP.style.display=title?'':'none';TOP.innerHTML=(crumb?`<div class="crumb">${crumb}<span>/</span></div>`:'')+`<h1>${title}</h1><div class="acts">${acts}</div>`}
async function refreshInv(){INV=await api('/api/invoices');drawNav()}
let CAM=null;
const stopCam=()=>{if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null}};
const blobUrl=async p=>{const r=await fetch(p);return URL.createObjectURL(await r.blob())};
async function go(id,arg){stopCam();$('#drawer')&&$('#drawer').classList.remove('on');ROUTE={id,arg};V.classList.toggle('flush',id==='case');drawNav();V.scrollTop=0;
  history.replaceState(null,'',id==='case'?'#case-'+encodeURIComponent(arg):'#'+id);
  try{await ({dash,inbox,case:caseView,approvals,vendors,ledger,vcheck,bank,activity,settings,insights})[id](arg)}catch(e){{V.innerHTML=`<div class="empty"><b>Could not load this page</b>${esc(e.message)}</div>`}}}
window.go=go;

/* scan a paper bill: same box and wiring on Dashboard and Inbox (needs #scanbtn in the topbar) */
const scanBox=()=>`<div id="sz" style="display:none;margin-bottom:14px" class="box"><div class="hd"><span class="lbl">Scan a paper bill · read on this machine, the photo never leaves it</span></div>
   <div style="padding:14px;display:grid;gap:10px"><video id="cam" autoplay playsinline muted></video>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="cap" disabled>Capture</button>
   <label class="btn" style="cursor:pointer">Upload / take photo<input id="pfile" type="file" accept="image/*" capture="environment" hidden></label>
   <span class="f3" id="smsg">Hold the whole bill flat in frame, in good light.</span></div></div></div>`;
function wireScan(){
  const sendPhoto=async src=>{const w0=src.videoWidth||src.naturalWidth,h0=src.videoHeight||src.naturalHeight,k=Math.min(1,2000/Math.max(w0,h0));
    const c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    await busy($('#cap'),'Reading…',async()=>{$('#smsg').textContent='Reading the bill and running the checks…';
      const r=await api('/api/scan',{image:c.toDataURL('image/jpeg',0.9)});
      toast(`${esc(r.invoice_key)}: ${esc(LBL[r.state]||r.state||r.outcome||'already processed')}`);go('case',r.invoice_key)});
    const m=$('#smsg');if(m)m.textContent='Hold the whole bill flat in frame, in good light.'};  // gone once the case page opened
  $('#scanbtn').onclick=async()=>{const z=$('#sz');if(z.style.display!=='none'){z.style.display='none';stopCam();return}z.style.display='block';
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){$('#cam').style.display='none';$('#smsg').textContent='Live camera needs this page on localhost or https: use Upload / take photo.';return}
    try{CAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});$('#cam').srcObject=CAM;$('#cap').disabled=false}
    catch(e){$('#cam').style.display='none';$('#smsg').textContent='Camera not available ('+e.name+'): use Upload / take photo.'}};
  $('#cap').onclick=()=>sendPhoto($('#cam'));
  const fromFile=async f=>{if(!f)return;const img=new Image();img.src=URL.createObjectURL(f);
    try{await img.decode()}catch(_){toast('Could not open that file as a picture: use JPG or PNG','err');return}sendPhoto(img)};
  window.__scanFile=fromFile;
  $('#pfile').onchange=e=>fromFile(e.target.files[0]);
}


/* ---------- shared chart helpers (inline SVG, no library) ---------- */
function areaChart(series,{h=160,labels=[],fmt=v=>v}={}){const W=600,H=h,P=24,n=Math.max(2,series[0].pts.length),mx=Math.max(1,...series.flatMap(s=>s.pts));
  const X=i=>P+i*(W-2*P)/(n-1),Y=v=>H-P-(v/mx)*(H-2*P);
  const grid=[0,.5,1].map(f=>`<line x1="${P}" x2="${W-P}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--line)"/><text x="${P-4}" y="${Y(mx*f)+3}" text-anchor="end" font-size="9" fill="var(--fg-3)">${fmt(mx*f)}</text>`).join('');
  const paths=series.map((s,k)=>{const d=s.pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    return `<defs><linearGradient id="ag${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".22"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${X(n-1)} ${H-P} L${X(0)} ${H-P}Z" fill="url(#ag${k})"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.6"/>${s.pts.map((v,i)=>v?`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${s.c}"><title>${labels[i]||''}: ${fmt(v)}</title></circle>`:'').join('')}`}).join('');
  const lab=labels.map((l,i)=>i%Math.ceil(n/7)===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--fg-3)">${l}</text>`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">${grid}${paths}${lab}</svg></div>`}
function donut(parts,size=110){const tot=parts.reduce((a,p)=>a+p.v,0)||1;let a0=-Math.PI/2;const r=size/2-8,c=size/2;
  const arcs=parts.filter(p=>p.v).map(p=>{const a1=a0+p.v/tot*Math.PI*2,lg=a1-a0>Math.PI?1:0;const d=`M${c+r*Math.cos(a0)} ${c+r*Math.sin(a0)} A${r} ${r} 0 ${lg} 1 ${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)}`;a0=a1;return `<path d="${d}" fill="none" stroke="${p.c}" stroke-width="14"><title>${p.l}: ${p.v}</title></path>`}).join('');
  return `<div class="donut"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${c}" y="${c+5}" text-anchor="middle" font-size="16" font-weight="600" fill="var(--fg)">${tot}</text></svg><div class="leg">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.l} <b class="mono">${p.v}</b></span>`).join('')}</div></div>`}
const STC={paid:'#1f8a63',awaiting_approval:'#384ce3',held:'#c27a12',duplicate:'#c03a2b',rejected:'#8a90a0'};
function dayBuckets(items,tsKey,valFn,days){const now=new Date();now.setHours(23,59,59,999);const out=Array(days).fill(0),lab=[];
  for(let i=days-1;i>=0;i--){const d=new Date(now-i*86400000);lab.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}
  items.forEach(it=>{const t=it[tsKey]*1000;const i=days-1-Math.floor((now-t)/86400000);if(i>=0&&i<days)out[i]+=valFn(it)});return {out,lab}}
function tierOf(v,inv){if(!v.trust)return ['na','Not checked'];const holds=inv.filter(r=>r.vendor_id===v.vendor_id&&['held','duplicate'].includes(r.state)).length;
  if(v.trust==='CANNOT_VERIFY')return ['high','High'];if(v.trust==='HOLD'||holds>1)return ['med','Medium'];return holds?['med','Medium']:['low','Low']}

async function insights(){
  topbar('Insights',{acts:`<button class="btn" id="act">Full activity log</button>`});
  V.innerHTML='<div style="padding:20px 24px">'+skel(6)+'</div>';
  const [pay,vend,ev]=await Promise.all([api('/api/payments'),api('/api/vendors'),api('/api/events'),refreshInv()]);
  const full=await Promise.all(INV.map(r=>api('/api/invoices/'+encodeURIComponent(r.invoice_key)).catch(()=>null)));
  const reasons={'Duplicate invoice':0,'Look-alike sender':0,'Bank account mismatch':0,'Bank-detail change':0,'Vendor not verifiable':0,'PO already billed':0};
  const byCheck={};let credits=0,cleared=0,escal=0,cannot=0;const seenV=new Set();
  full.forEach(c=>{if(!c)return;const d=c.decision,s=c.invoice.state,amt=c.extracted.amount_inr||0;
    (d.checks||[]).forEach(k=>{byCheck[k.check]=byCheck[k.check]||{pass:0,fail:0,warn:0,unavailable:0};byCheck[k.check][k.result]=(byCheck[k.check][k.result]||0)+1;
      if(['held','duplicate'].includes(s)&&k.result==='fail'){const r=k.check==='duplicate'?'Duplicate invoice':k.check==='sender_domain'?'Look-alike sender':k.check==='bank_details'?'Bank account mismatch':k.check==='bank_change'?'Bank-detail change':k.check==='vendor_trust'?'Vendor not verifiable':k.check==='three_way_match'?'PO already billed':null;if(r)reasons[r]+=amt}});
    const t=d.trust_report;if(t&&!seenV.has(c.invoice.vendor_id)){seenV.add(c.invoice.vendor_id);credits+=t.cost.credits;cleared+=t.screening.hits_cleared;escal+=t.screening.hits_escalated;cannot+=t.cannot_verify.length}});

    <div class="blk"><div class="bh"><h3>Outcomes<span class="sub">Every document, by result</span></h3></div><div class="bb">${donut(Object.entries({paid:'Paid',awaiting_approval:'Needs approval',held:'Held',duplicate:'Duplicate',rejected:'Not payable'}).map(([k,l])=>({l,c:STC[k],v:INV.filter(r=>r.state===k).length})))}</div></div></div>
   <div class="ins">
    <div class="box"><div class="hd"><span class="lbl">Where money was stopped</span></div><div class="bd">${Object.entries(reasons).map(([k,v])=>`<div class="hbar"><span>${k}</span><span class="t"><i style="width:${v/mx*100}%"></i></span><span class="mono r">${inr(v)}</span></div>`).join('')}</div></div>
    <div class="box"><div class="hd"><span class="lbl">Price against cost</span></div><div class="bd">

      <div class="hbar"><span>Invoices processed</span><span class="mono">${nI} × ₹60</span><span class="mono r">${inr(nI*60)}</span></div>
      <div class="hbar"><span>Data cost</span><span class="mono">${credits.toFixed(1)} cr × ₹25</span><span class="mono r">−${inr(cost)}</span></div>
      <div class="hbar" style="border-top:1px solid var(--line);padding-top:8px"><b>Gross margin</b><span></span><span class="mono r"><b>${rev?Math.round((rev-cost)/rev*100):0}%</b></span></div>
      <p class="f3" style="margin:8px 0 0">Prices are our proposal. Model cost is ₹0: no model makes a decision.</p></div></div>
    <div class="box"><div class="hd"><span class="lbl">Checks by result</span></div><div class="bd"><table class="tbl"><thead><tr><th>Check</th><th class="r">Pass</th><th class="r">Fail</th><th class="r">Warn</th></tr></thead><tbody>${Object.entries(byCheck).map(([k,v])=>`<tr><td>${esc(chkName(k))}</td><td class="r mono" style="color:var(--paid)">${v.pass||0}</td><td class="r mono" style="color:var(--bad)">${(v.fail||0)+(v.unavailable||0)}</td><td class="r mono" style="color:var(--held)">${v.warn||0}</td></tr>`).join('')}</tbody></table>

   </div></div>`;
  const drawFlow=days=>{const sm=st=>dayBuckets(INV.filter(r=>st.includes(r.state)),'updated_at',r=>r.amount_inr||0,days);

  const table=rows=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Result</th><th>Date</th><th>Bank line</th><th class="r">Amount</th><th>Payee</th><th>Account</th><th>Why</th></tr></thead><tbody>${rows.map((l,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td><span class="st ${res(l.result)}">${ICON[res(l.result)]||ICON.none}<span class="t">${esc(lab(l.result))}</span></span></td><td>${esc(l.date)}</td><td class="mono">${esc(l.description)}</td><td class="r mono num">${inr(l.amount_inr)}</td><td>${esc(l.payee||'—')}</td><td>${esc(l.account||'—')}</td><td class="f2" title="${esc(l.reason)}">${esc(l.reason)}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>No lines posted yet</b>Paste a statement above.</div></td></tr>'}</tbody></table></div>`;
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Paste statement lines as CSV (date, description, amount). Each line gets a payee and ledger account, duplicates are held, and unknown payees are never guessed. Re-posting the same file posts nothing twice.</p>
   <div class="box" style="margin-bottom:20px"><div style="padding:14px;display:grid;gap:8px"><textarea id="csv">${SAMPLE}</textarea><div style="display:flex;gap:8px"><button class="btn primary" id="post">Post lines</button><button class="btn ghost" id="samp">Reset to sample</button></div></div></div>
   <div class="sec" style="margin-top:0"><span class="lbl">Posted lines</span></div><div id="bt">${skel(4)}</div>`;
  $('#bt').innerHTML=table(await api('/api/bank'));
  $('#samp').onclick=()=>$('#csv').value=SAMPLE;
  $('#post').onclick=e=>busy(e.currentTarget,'Posting…',async()=>{const r=await api('/api/bank',{csv:$('#csv').value});
    const n=k=>r.lines.filter(l=>l.result===k).length;toast(`${n('POSTED')} posted · ${n('HELD')} held · ${n('CANNOT_VERIFY')} cannot verify`);$('#bt').innerHTML=table(r.lines)});
}

async function ledger(){
  topbar('Ledger',{crumb:'<a onclick="go(\'inbox\')">Payments</a>'});V.innerHTML=skel();const p=await api('/api/payments');
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Simulated payment rails. One row per invoice: the idempotency key is the primary key, so a retry, restart or second approval cannot add a row.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Paid</th><th>Payee</th><th>Account</th><th class="r">Amount</th><th>Approved by</th><th>Reference</th><th>Idempotency key</th></tr></thead><tbody>
  ${p.map((r,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td class="f2" title="${tsf(r.paid_at)}">${ago(r.paid_at)}</td><td>${esc(r.payee)}</td><td class="mono" title="IFSC ${esc(r.ifsc)}">${esc(r.account)}</td><td class="r mono num">${inr(r.amount_inr)}</td><td class="mono">${esc(r.approved_by)}</td><td class="mono"><span class="copy" data-copy="${esc(r.ref)}">${esc(r.ref)}</span></td><td class="mono f3"><span class="copy" data-copy="${esc(r.idempotency_key)}">${esc(r.idempotency_key)}</span></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>No payments yet</b>Approve a ready invoice to pay it.</div></td></tr>'}</tbody>
  <tfoot><tr><td colspan="3">Total paid</td><td class="r mono num">${inr(p.reduce((a,r)=>a+r.amount_inr,0))}</td><td colspan="3" class="f3">${p.length} payment${p.length===1?'':'s'}</td></tr></tfoot></table></div>`;
  bindCopy(V);
}

async function activity(){
  topbar('Activity',{crumb:'<a onclick="go(\'insights\')">Insights</a>'});V.innerHTML=skel(10);const e=await api('/api/events');
  V.innerHTML=`<div class="chips"><input class="search" id="aq" placeholder="Filter events…" style="margin-left:0"></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Time</th><th>Job</th><th>Event</th></tr></thead><tbody id="at"></tbody></table></div>`;
  const draw=q=>{$('#at').innerHTML=e.filter(r=>!q||(r.msg+(r.job_id||'')).toLowerCase().includes(q)).map(r=>`<tr><td class="mono f3">${tsf(r.at)}</td><td class="mono">${esc(r.job_id||'—')}</td><td style="${r.level==='error'?'color:var(--bad)':r.level==='warn'?'color:var(--held)':''}" title="${esc(r.msg)}">${esc(r.msg)}</td></tr>`).join('')};
  draw('');$('#aq').oninput=x=>draw(x.target.value.toLowerCase());
}

async function settings(){
  topbar('Settings');const s=await api('/api/settings');
  const f=[['max_credits_per_job','Cost limit per job','Crustdata credits. A job that reaches it stops and says cannot verify.'],['max_seconds_per_job','Time limit per job','Seconds.'],['auto_approve_below_inr','Auto-approve payments below','₹. 0 means every payment needs a person.'],['min_age_years','Flag companies younger than','Years.'],['min_headcount','Flag headcount below','People.'],['min_read_confidence','Hold a scanned bill when a field is read below','Confidence, 0 to 1. A person compares that field with the photo.']];
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Limits and approval policy for every run. Changes apply to the next job and are written to the activity log.</p>
  <div style="max-width:640px"><div class="field"><div><div class="h">Approver name</div><div class="d">Recorded on every payment you approve.</div></div><input id="s_approver_name" value="${esc(s.approver_name||'AP lead')}"></div>${f.map(([k,l,d])=>`<div class="field"><div><div class="h">${l}</div><div class="d">${d}</div></div><input id="s_${k}" class="num" value="${esc(s[k])}"></div>`).join('')}
  <div style="margin-top:16px"><button class="btn primary" id="save">Save settings</button></div></div>`;
  $('#save').onclick=e=>busy(e.currentTarget,'Saving…',async()=>{const b={approver_name:$('#s_approver_name').value};f.forEach(([k])=>b[k]=$('#s_'+k).value);await api('/api/settings',b);ME={name:b.approver_name};$('#who').textContent=b.approver_name;$('#av').textContent=(b.approver_name||'A')[0].toUpperCase();toast('Settings saved')});
}

/* ============ command palette + keyboard ============ */
let PI=0,PL=[];
function palOpen(){$('#pal').classList.add('on');$('#pq').value='';PI=0;palDraw();setTimeout(()=>$('#pq').focus(),0)}
function palClose(){$('#pal').classList.remove('on')}
function palDraw(){const q=$('#pq').value.toLowerCase();
  const items=[...SCREENS.map(s=>({g:'Go to',t:s.t,k:'g '+s.k,run:()=>go(s.id)})),
    {g:'Actions',t:'Process inbox',run:async()=>{const r=await api('/api/process',{});toast(`Processed ${r.length} documents`);go('inbox')}},
    {g:'Actions',t:'Post bank lines',run:()=>go('bank')},{g:'Actions',t:'Run a vendor check',run:()=>go('vcheck')},
    ...INV.map(r=>({g:'Documents',t:`${r.invoice_no||nice(r.doc_type)} · ${r.vendor_id||''} · ${LBL[r.state]||r.state}`,run:()=>go('case',r.invoice_key)}))];
  PL=items.filter(i=>!q||i.t.toLowerCase().includes(q)).slice(0,30);PI=Math.min(PI,Math.max(0,PL.length-1));let g='';
  $('#pres').innerHTML=PL.map((i,n)=>{const h=i.g!==g?`<div class="gh lbl">${i.g}</div>`:'';g=i.g;return h+`<div class="it ${n===PI?'on':''}" data-n="${n}">${esc(i.t)}${i.k?`<span class="k kbd">${i.k}</span>`:''}</div>`}).join('')||'<div class="empty">No matches</div>';
  $$('#pres .it').forEach(el=>{el.onclick=()=>{palClose();PL[+el.dataset.n].run()};el.onmouseenter=()=>{PI=+el.dataset.n;$$('#pres .it').forEach(x=>x.classList.toggle('on',x===el))}})}
$('#pq').oninput=()=>{PI=0;palDraw()};
$('#pal').onclick=e=>{if(e.target.id==='pal')palClose()};
$('#kopen').onclick=palOpen;
let gKey=false;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').classList.contains('on')?palClose():palOpen();return}
  if($('#pal').classList.contains('on')){if(e.key==='Escape')palClose();
    if(e.key==='ArrowDown'){PI=Math.min(PI+1,PL.length-1);palDraw();e.preventDefault()}if(e.key==='ArrowUp'){PI=Math.max(PI-1,0);palDraw();e.preventDefault()}
    if(e.key==='Enter'&&PL[PI]){palClose();PL[PI].run()}return}
  if(typing){if(e.key==='Escape')document.activeElement.blur();return}
  if(gKey){gKey=false;const sc=SCREENS.find(x=>x.k===e.key);if(sc){go(sc.id);e.preventDefault()}return}
  if(e.key==='g'){gKey=true;setTimeout(()=>gKey=false,900);return}
  if(e.key==='Escape'&&$('#drawer').classList.contains('on')){$('#drawer').classList.remove('on');return}
  if(e.key==='Escape'&&ROUTE.id==='case'){go('inbox');return}
  if(ROUTE.id==='inbox'){const rows=$$('#tb tr[data-k]');
    const mv=n=>{SEL=Math.max(0,Math.min(rows.length-1,SEL+n));rows.forEach((r,i)=>r.classList.toggle('sel',i===SEL));rows[SEL]?.scrollIntoView({block:'nearest'});e.preventDefault()};
    if(e.key==='j'||e.key==='ArrowDown')mv(1);if(e.key==='k'||e.key==='ArrowUp')mv(-1);
    if(e.key==='Enter'&&rows[SEL])go('case',rows[SEL].dataset.k);
    if(e.key==='/'){$('#q')?.focus();e.preventDefault()}}
});

/* ============ boot ============ */
$('#setme').onclick=()=>go('settings');
(async()=>{
  try{
    ME=await api('/api/me');const nm=ME&&ME.name||'AP lead';$('#who').textContent=nm;$('#av').textContent=nm[0].toUpperCase();
    await refreshInv();
    const h=decodeURIComponent(location.hash.slice(1));
    if(h.startsWith('case-'))go('case',h.slice(5));else go(SCREENS.some(s=>s.id===h)?h:'dash');
  }catch(e){V.innerHTML=`<div class="empty"><b>Could not start</b>${esc(e.message)}</div>`}
})();
</script>
</body>
