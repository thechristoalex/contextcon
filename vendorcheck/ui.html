<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payables Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=3">
<style>
/* full-screen bill scanner: fixed, so it can never open off-screen; sized for phones first */
.scn{position:fixed;inset:0;z-index:1000;background:#05070d;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scn[hidden]{display:none}
.scn-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:600;font-size:17px}
.scn-x{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:20px;line-height:40px}
.scn-view{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scn-view video,.scn-view img{width:100%;height:100%;object-fit:contain;background:#000}
.scn-view video[hidden],.scn-view img[hidden],.scn-frame[hidden]{display:none}
.scn-frame{position:absolute;inset:6% 8%;border:2px solid rgba(255,255,255,.75);border-radius:12px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.scn-msg{position:absolute;left:16px;right:16px;bottom:16px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.72);font-size:15px;line-height:1.35;text-align:center}
.scn-msg[hidden]{display:none}.scn-msg.err{background:#b42318}
.scn-msg.busy::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:scnspin .8s linear infinite}
@keyframes scnspin{to{transform:rotate(360deg)}}
.scn-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 16px 22px;gap:12px}
.scn-side{justify-self:center;color:#fff;font-size:15px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.12);cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:center}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #05070d;cursor:pointer;display:block;padding:0;-webkit-tap-highlight-color:transparent}
.shutter:disabled{opacity:.35}.shutter:active{transform:scale(.94)}.shutter[hidden]{display:none}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px}
body.noscroll{overflow:hidden}
/* the bill built from the photo, at the top of the case page */
.billcard{border:1px solid var(--line,#e4e7ec);border-radius:12px;padding:16px;margin:0 0 16px;background:#fff}
.bc-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px dashed var(--line,#e4e7ec);padding-bottom:12px;margin-bottom:12px}
.bc-h h3{margin:4px 0 2px;font-size:18px}.bc-amt{font-size:22px;font-weight:600;white-space:nowrap}
.bc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:0}
.bc-grid dt{font-size:12px;color:#667085}.bc-grid dd{margin:2px 0 0;font-family:"IBM Plex Mono",monospace;font-size:14px;overflow-wrap:anywhere}
.bc-grid dd.miss{color:#98a2b3;font-family:inherit}.lo{color:#b54708;font-size:12px;font-family:Inter,sans-serif}
.bc-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#667085;margin:16px 0 8px;font-weight:600}
.bc-parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bc-party{border:1px solid var(--line,#e4e7ec);border-radius:10px;padding:10px 12px}.bc-party b{display:block;font-size:15px;margin:2px 0}
.mk{display:inline-block;font:600 11px/1 Inter,sans-serif;padding:3px 6px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.mk.checked{background:#e7f6ec;color:#067647}.mk.read{background:#f2f4f7;color:#475467}.mk.computed{background:#eef4ff;color:#3538cd}
.mk.invalid{background:#fef3f2;color:#b42318}.mk.conflict{background:#fffaeb;color:#b54708}
.fnote{font:12px/1.35 Inter,sans-serif;color:#b54708;margin-top:2px;word-break:normal}.fnote.bad{color:#b42318}
.bc-items{width:100%;border-collapse:collapse;font-size:13px}.bc-items th{font-weight:600;color:#667085;text-align:left;font-size:11px;padding:6px 4px;border-bottom:1px solid var(--line,#e4e7ec)}
.bc-items td{padding:6px 4px;border-bottom:1px solid #f2f4f7;vertical-align:top}.bc-items .r{text-align:right;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.bc-sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;max-width:420px;margin-left:auto}.bc-sum .r{text-align:right;font-family:"IBM Plex Mono",monospace}
.bc-sum .t{font-weight:700;font-size:16px;border-top:1px solid var(--line,#e4e7ec);padding-top:6px}
.bc-checks{list-style:none;padding:0;margin:0;font-size:13px}.bc-checks li{padding:4px 0;display:flex;gap:8px}.bc-checks .ok{color:#067647}.bc-checks .no{color:#b42318}
.scanph{position:relative;align-self:start}.scanph img{width:100%;display:block;border-radius:4px}
.scanph i{position:absolute;outline:2px solid #384ce3;background:rgba(56,76,227,.14);border-radius:2px}
.scangrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:800px){.scangrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="scanner" class="scn" hidden role="dialog" aria-label="Scan a bill">
  <div class="scn-top"><span>Scan a bill</span><button class="scn-x" id="scnx" aria-label="Close">✕</button></div>
  <div class="scn-view"><video id="cam" autoplay playsinline muted></video><img id="scnshot" alt="The photo being read" hidden><div class="scn-frame" id="scnframe"></div><div id="scnmsg" class="scn-msg" hidden></div></div>
  <div class="scn-bar">
    <label class="scn-side" for="pphoto">Photos</label>
    <button class="shutter" id="shutter" aria-label="Capture the bill" disabled></button>
    <label class="shutter" id="shutterL" for="pcam" aria-label="Take a photo of the bill" hidden></label>
    <label class="scn-side" for="pcam">iPhone Camera</label>
  </div>
  <input id="pcam" class="vh" type="file" accept="image/*" capture="environment">
  <input id="pphoto" class="vh" type="file" accept="image/*">
</div>
<div class="shell">
  <aside class="side">
    <div class="brand"><svg width="20" height="18" viewBox="0 0 26 22" fill="none" stroke="#384ce3" stroke-width="2"><path d="M13 2 24 7 13 12 2 7z"/><path d="M2 11.5 13 16.5 24 11.5"/><path d="M2 15.5 13 20.5 24 15.5"/></svg>Payables Desk</div>
    <button class="kbtn" id="kopen" aria-label="Open command palette"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search or jump to…<span class="kbd" style="margin-left:auto">⌘K</span></button>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="avatar" id="av">·</div><div class="who" id="who">…</div><button class="btn ghost sm" id="setme" title="Change approver name">Edit</button></div>
  </aside>
  <section class="main">
    <div class="top" id="top"></div>
    <div class="view" id="view"></div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Command palette"><div class="bx"><input id="pq" placeholder="Type a command or search documents…" autocomplete="off"><div class="res" id="pres"></div></div></div>

<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const V=$('#view'), TOP=$('#top');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>n==null?'—':'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ago=t=>{if(!t)return '—';const s=Date.now()/1000-t;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return new Date(t*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const tsf=t=>t?new Date(t*1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const nice=s=>String(s||'').replace(/_/g,' ');
const CHK={classify:'Document type',vendor_identified:'Vendor identified',duplicate:'Duplicate check',sender_domain:'Sender domain',gstin_binding:'GSTIN binding',three_way_match:'3-way match',bank_details:'Bank account',vendor_trust:'Vendor check',bank_change:'Bank-detail change',payable:'Payable document'};
const chkName=k=>CHK[k]||nice(k);

/* status icons: shape + colour, never colour alone */
const ICON={
 paid:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M4.2 7.2 6.1 9l3.7-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
 awaiting_approval:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 0 1 7 12.5Z" fill="currentColor"/></svg>',
 approved:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 1 1 1.5 7H7Z" fill="currentColor"/></svg>',
 held:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="4.2" width="1.3" height="5.6" fill="currentColor"/><rect x="7.7" y="4.2" width="1.3" height="5.6" fill="currentColor"/></svg>',
 duplicate:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m3.2 10.8 7.6-7.6" stroke="currentColor" stroke-width="1.5"/></svg>',
 rejected:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="m4.6 4.6 4.8 4.8M9.4 4.6 4.6 9.4" stroke="#fff" stroke-width="1.5"/></svg>',
 pass:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#1f8a63"/><path d="M4.2 7.2 6.1 9l3.7-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
 warn:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#c27a12"/><rect x="6.3" y="3.4" width="1.4" height="4.6" fill="#fff"/><rect x="6.3" y="9.2" width="1.4" height="1.4" fill="#fff"/></svg>',
 fail:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#c03a2b"/><path d="m4.6 4.6 4.8 4.8M9.4 4.6 4.6 9.4" stroke="#fff" stroke-width="1.5"/></svg>',
 unavailable:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#c03a2b" stroke-width="1.5" stroke-dasharray="2 2"/></svg>',
 none:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#8a90a0" stroke-width="1.5" stroke-dasharray="2 2"/></svg>'};
const LBL={paid:'Paid',awaiting_approval:'Needs approval',approved:'Approved',held:'Held',duplicate:'Duplicate',rejected:'Rejected'};
const st=s=>`<span class="st ${s}" title="${esc(LBL[s]||nice(s))}">${ICON[s]||ICON.none}<span class="t">${esc(LBL[s]||nice(s))}</span></span>`;
const pill=(r,label)=>`<span class="pill ${r}">${esc(label||r)}</span>`;

/* toasts */
function toast(msg,kind='ok'){const t=document.createElement('div');t.className='toast '+kind;
  t.innerHTML=(kind==='err'?'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/></svg>':'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 8.5 3 3 7-7"/></svg>')+`<div>${msg}</div>`;
  $('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)},3200)}
/* button loading state */
async function busy(btn,label,fn){const html=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${label}`;try{return await fn()}catch(e){toast(esc(e.message),'err')}finally{if(document.body.contains(btn)){btn.disabled=false;btn.innerHTML=html}}}
/* copy to clipboard with inline confirmation */
function bindCopy(root=document){root.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async e=>{e.stopPropagation();
  try{await navigator.clipboard.writeText(el.dataset.copy)}catch{};const o=el.textContent;el.classList.add('ok');el.textContent='Copied';setTimeout(()=>{el.classList.remove('ok');el.textContent=o},1200)})}
/* count-up numbers */
function countUp(root=document){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,fmt=el.dataset.fmt;const f=n=>fmt==='inr'?inr(n):Math.round(n);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!to){el.textContent=f(to);return}
  const t0=performance.now(),d=600;(function step(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)})(t0)})}
const skel=(n=6)=>`<div class="tblwrap"><table class="tbl"><tbody>${Array.from({length:n},(_,i)=>`<tr><td><div class="skel" style="width:${45+((i*37)%45)}%"></div></td><td><div class="skel" style="width:60%"></div></td><td><div class="skel" style="width:30%"></div></td></tr>`).join('')}</tbody></table></div>`;

/* ============ auth + api ============ */
let ME=null, INV=[];
async function api(p,b){const h={'content-type':'application/json'};
  const r=await fetch(p,b?{method:'POST',headers:h,body:JSON.stringify(b)}:{headers:h});
  const j=await r.json(); if(j&&j.error&&r.status>=400)throw new Error(j.error); return j}

/* ============ navigation ============ */
const IC={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7H2v-7z"/>',
 appr:'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>',vend:'<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>',
 check:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',bank:'<path d="M3 10h18M5 10v8M9 10v8M15 10v8M19 10v8M2 21h20M12 3l9 5H3z"/>',
 led:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',log:'<path d="M4 6h16M4 12h16M4 18h10"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const SCREENS=[
 {g:'Work',id:'dash',t:'Dashboard',ic:'dash',k:'d'},{g:'Work',id:'inbox',t:'Inbox',ic:'inbox',k:'i'},{g:'Work',id:'approvals',t:'Approvals',ic:'appr',k:'a'},
 {g:'Records',id:'vendors',t:'Vendors',ic:'vend',k:'v'},{g:'Records',id:'ledger',t:'Ledger',ic:'led',k:'l'},
 {g:'Tools',id:'vcheck',t:'Vendor check',ic:'check',k:'c'},{g:'Tools',id:'bank',t:'Bank lines',ic:'bank',k:'b'},
 {g:'System',id:'activity',t:'Activity',ic:'log',k:'y'},{g:'System',id:'settings',t:'Settings',ic:'set',k:'s'}];
let ROUTE={id:'dash'};
function drawNav(){const waiting=INV.filter(r=>r.state==='awaiting_approval').length,held=INV.filter(r=>r.state==='held').length;
  const cnt={inbox:INV.length,approvals:waiting+held};let g='';
  $('#nav').innerHTML=SCREENS.map(s=>{const hd=s.g!==g?`<div class="grp lbl">${s.g}</div>`:'';g=s.g;
    const c=cnt[s.id]!=null?`<span class="cnt ${s.id==='approvals'&&waiting?'hot':''}">${cnt[s.id]}</span>`:'';
    return hd+`<a data-r="${s.id}" class="${ROUTE.id===s.id||(ROUTE.id==='case'&&s.id==='inbox')?'on':''}" title="g then ${s.k}"><svg viewBox="0 0 24 24">${IC[s.ic]}</svg>${s.t}${c}</a>`}).join('');
  $$('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.r))}
function topbar(title,{crumb,acts=''}={}){TOP.innerHTML=(crumb?`<div class="crumb">${crumb}<span>/</span></div>`:'')+`<h1>${title}</h1><div class="acts">${acts}</div>`}
async function refreshInv(){INV=await api('/api/invoices');drawNav()}
let CAM=null;
const stopCam=()=>{if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null}};
const blobUrl=async p=>{const r=await fetch(p);return URL.createObjectURL(await r.blob())};
async function go(id,arg){closeScanner();ROUTE={id,arg};V.classList.toggle('flush',id==='case');drawNav();V.scrollTop=0;
  history.replaceState(null,'',id==='case'?'#case-'+encodeURIComponent(arg):'#'+id);
  try{await ({dash,inbox,case:caseView,approvals,vendors,ledger,vcheck,bank,activity,settings})[id](arg)}catch(e){{V.innerHTML=`<div class="empty"><b>Could not load this page</b>${esc(e.message)}</div>`}}}
window.go=go;

/* scan a paper bill. The scanner is a full-screen layer, so it cannot open off-screen on a phone.
   Live camera when the page is https or localhost and permission is given; otherwise the white button opens
   the iPhone camera itself (file input with capture). Either way: photo -> /api/scan -> the case page. */
const scanBox=()=>'';
const scanMsg=(t,kind)=>{const m=$('#scnmsg');m.textContent=t||'';m.className='scn-msg'+(kind?' '+kind:'');m.hidden=!t};
const liveMode=on=>{$('#cam').hidden=!on;$('#scnframe').hidden=!on;$('#shutter').hidden=!on;$('#shutterL').hidden=on};
function closeScanner(){stopCam();const s=$('#scanner');if(s)s.hidden=true;document.body.classList.remove('noscroll')}
async function openScanner(){
  const s=$('#scanner');s.hidden=false;document.body.classList.add('noscroll');
  $('#scnshot').hidden=true;$('#shutter').disabled=true;liveMode(true);
  if(!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    liveMode(false);return scanMsg('Tap the white button to take a photo of the bill.')}
  scanMsg('Starting the camera…','busy');
  try{
    stopCam();
    CAM=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}}});
    if(s.hidden){stopCam();return}
    const v=$('#cam');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.srcObject=CAM;
    await v.play().catch(()=>{});  // iOS: start it explicitly; autoplay alone can leave the preview black
    await new Promise((ok,no)=>{const t0=Date.now();(function wait(){if(v.videoWidth>0)return ok();if(Date.now()-t0>8000)return no(new Error('no frames'));requestAnimationFrame(wait)})()});
    $('#shutter').disabled=false;scanMsg('Fit the whole bill inside the frame, then tap the white button.');
  }catch(e){stopCam();liveMode(false);
    scanMsg(e.name==='NotAllowedError'?'Camera access was not allowed. Tap the white button to use the iPhone camera instead.':'Live camera is not available here. Tap the white button to use the iPhone camera.')}
}
function toCanvas(src,w0,h0){const k=Math.min(1,2000/Math.max(w0,h0)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
async function fileToCanvas(f){const u=URL.createObjectURL(f);try{const img=new Image();img.src=u;
  await (img.decode?img.decode():new Promise((ok,no)=>{img.onload=ok;img.onerror=no}));
  return toCanvas(img,img.naturalWidth,img.naturalHeight)}finally{setTimeout(()=>URL.revokeObjectURL(u),1000)}}
async function submitScan(c){
  const data=c.toDataURL('image/jpeg',0.88);
  if(data.length<2000){liveMode(false);return scanMsg('The photo came out empty. Tap the white button to try again.','err')}
  const shot=$('#scnshot');shot.src=data;shot.hidden=false;$('#cam').hidden=true;$('#scnframe').hidden=true;$('#shutter').disabled=true;
  scanMsg('Reading the bill and making the invoice… a few seconds','busy');
  try{const r=await api('/api/scan',{image:data});
    if(!r||!r.invoice_key)throw new Error('The server did not return an invoice.');
    closeScanner();toast(`${esc(r.invoice_key)}: ${esc(LBL[r.state]||r.state||'already scanned')}`);go('case',r.invoice_key)}
  catch(e){shot.hidden=true;liveMode(false);
    scanMsg((/load failed|failed to fetch|network/i.test(e.message||'')?'Could not reach the app. Check the connection.':e.message||'The scan failed.')+' Tap the white button to try again.','err')}
}
async function onPicked(e){const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if($('#scanner').hidden){$('#scanner').hidden=false;document.body.classList.add('noscroll')}
  stopCam();
  let c;try{c=await fileToCanvas(f)}catch(_){liveMode(false);return scanMsg('That file could not be opened as a picture. Use a JPG, PNG or a new photo.','err')}
  submitScan(c)}
$('#scnx').onclick=closeScanner;
$('#shutter').onclick=()=>{const v=$('#cam');if(!v.videoWidth)return scanMsg('The camera is still starting. Try again in a second.','err');
  const c=toCanvas(v,v.videoWidth,v.videoHeight);stopCam();submitScan(c)};
$('#pcam').onchange=onPicked;$('#pphoto').onchange=onPicked;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scanner').hidden)closeScanner()});

/* ============ screens ============ */
async function dash(){
  topbar('Dashboard',{acts:`<button class="btn" id="scanbtn">Scan a bill</button><button class="btn primary" id="proc">Process inbox</button>`});
  V.innerHTML=`<div class="kpis">${[1,2,3,4].map(()=>'<div class="kpi"><div class="skel" style="width:50%"></div><div class="skel" style="width:30%;height:22px;margin-top:10px"></div></div>').join('')}</div>`;
  const [pay,ev]=await Promise.all([api('/api/payments'),api('/api/events'),refreshInv()]);
  const w=INV.filter(r=>r.state==='awaiting_approval'),h=INV.filter(r=>r.state==='held'),d=INV.filter(r=>r.state==='duplicate');
  const paid=pay.reduce((a,r)=>a+r.amount_inr,0), stopped=[...h,...d].reduce((a,r)=>a+(r.amount_inr||0),0);
  V.innerHTML=`${scanBox()}<div class="kpis">
    <div class="kpi"><div class="lbl">Needs approval</div><div class="v" data-count="${w.length}">0</div><div class="s">${inr(w.reduce((a,r)=>a+(r.amount_inr||0),0))} waiting</div></div>
    <div class="kpi"><div class="lbl">Held with reason</div><div class="v" data-count="${h.length}">0</div><div class="s">for a person to review</div></div>
    <div class="kpi"><div class="lbl">Paid once</div><div class="v" data-count="${paid}" data-fmt="inr">0</div><div class="s">${pay.length} payment${pay.length===1?'':'s'}</div></div>
    <div class="kpi"><div class="lbl">Stopped before paying</div><div class="v" data-count="${stopped}" data-fmt="inr">0</div><div class="s">${h.length+d.length} held or duplicate</div></div></div>
  <div class="cols"><div class="box"><div class="hd"><span class="lbl">Needs you</span><span class="f3" style="margin-left:auto">${w.length+h.length}</span></div><div class="bd">
    ${[...w,...h].map((r,i)=>`<div class="li rowin" style="animation-delay:${i*20}ms" data-k="${esc(r.invoice_key)}">${st(r.state)}<span class="grow"><span class="mono">${esc(r.invoice_no||nice(r.doc_type))}</span> <span class="f3">· ${esc(r.vendor_id||'')}</span> <span class="f2">${esc((r.reason||'').slice(0,70))}</span></span><span class="mono num">${inr(r.amount_inr)}</span></div>`).join('')||'<div class="empty"><b>Nothing needs you</b>New documents appear here after Process inbox.</div>'}
  </div></div>
  <div class="box"><div class="hd"><span class="lbl">Recent activity</span></div><div class="feed">${ev.slice(0,12).map(e=>`<div class="ev"><span class="f3">${ago(e.at)}</span><span class="f2">${esc(e.msg.slice(0,110))}</span></div>`).join('')}</div></div></div>`;
  countUp(V);$$('.li[data-k]').forEach(el=>el.onclick=()=>go('case',el.dataset.k));wireScan();
  $('#proc').onclick=e=>busy(e.currentTarget,'Processing…',async()=>{const r=await api('/api/process',{});toast(`Processed ${r.length} document${r.length===1?'':'s'}`);go('dash')});
}

let FILTER='all', Q='', SEL=0;
async function inbox(){
  topbar('Inbox',{acts:`<button class="btn" id="scanbtn">Scan a bill</button><button class="btn" id="drop">Add document</button><button class="btn primary" id="proc">Process inbox</button>`});
  V.innerHTML=skel();await refreshInv();
  const F={all:['All',()=>true],awaiting_approval:['Needs approval',r=>r.state==='awaiting_approval'],held:['Held',r=>r.state==='held'],paid:['Paid',r=>r.state==='paid'],duplicate:['Duplicate',r=>r.state==='duplicate']};
  const draw=()=>{const rows=INV.filter(F[FILTER][1]).filter(r=>!Q||JSON.stringify(r).toLowerCase().includes(Q));SEL=Math.min(SEL,Math.max(0,rows.length-1));
    $('#tb').innerHTML=rows.map((r,i)=>`<tr class="click rowin ${i===SEL?'sel':''}" style="animation-delay:${i*20}ms" data-k="${esc(r.invoice_key)}"><td>${st(r.state)}</td><td class="mono">${esc(r.invoice_no||nice(r.doc_type))}</td><td>${esc(r.vendor_id||'—')}</td><td class="r mono num">${inr(r.amount_inr)}</td><td class="r mono num f3">${r.risk_score??''}</td><td class="f2" title="${esc(r.reason)}">${esc(r.reason||'')}</td><td class="f3 r">${ago(r.updated_at)}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><b>No documents here</b>Change the filter or process the inbox.</div></td></tr>`;
    $$('#tb tr[data-k]').forEach((tr,i)=>{tr.onclick=()=>go('case',tr.dataset.k);tr.onmouseenter=()=>{SEL=i;$$('#tb tr').forEach((x,j)=>x.classList.toggle('sel',j===i))}})};
  V.innerHTML=`${scanBox()}
   <div id="dz" style="display:none;margin-bottom:14px" class="box"><div class="hd"><span class="lbl">Add an invoice or email</span></div><div style="padding:14px;display:grid;gap:8px"><input id="fname" placeholder="file name, e.g. 08_new_invoice.txt"><textarea id="txt" placeholder="Paste the invoice or email text"></textarea><div><button class="btn primary" id="send">Process document</button></div></div></div>
   <div class="chips">${Object.entries(F).map(([k,[l,f]])=>`<button class="chip ${FILTER===k?'on':''}" data-f="${k}">${l}<b>${INV.filter(f).length}</b></button>`).join('')}<input class="search" id="q" placeholder="Filter…" value="${esc(Q)}"></div>
   <div class="tblwrap"><table class="tbl"><thead><tr><th>Status</th><th>Invoice</th><th>Vendor</th><th class="r">Amount</th><th class="r">Risk</th><th>Reason</th><th class="r">Updated</th></tr></thead><tbody id="tb"></tbody></table></div>
   <div class="f3" style="margin-top:10px"><span class="kbd">j</span> <span class="kbd">k</span> move · <span class="kbd">Enter</span> open · <span class="kbd">/</span> filter · <span class="kbd">⌘K</span> jump</div>`;
  draw();
  $$('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;SEL=0;$$('[data-f]').forEach(x=>x.classList.toggle('on',x===b));draw()});
  $('#q').oninput=e=>{Q=e.target.value.toLowerCase();SEL=0;draw()};
  wireScan();
  $('#drop').onclick=()=>{const z=$('#dz');z.style.display=z.style.display==='none'?'block':'none';$('#txt').focus()};
  $('#send').onclick=e=>busy(e.currentTarget,'Checking…',async()=>{const r=await api('/api/upload',{name:$('#fname').value||('upload_'+Date.now()+'.txt'),text:$('#txt').value});toast(`${esc(r.invoice_key||'Document')}: ${esc(LBL[r.state]||r.state||r.outcome)}`);go('case',r.invoice_key)});
  $('#proc').onclick=e=>busy(e.currentTarget,'Processing…',async()=>{const r=await api('/api/process',{});toast(`Processed ${r.length} document${r.length===1?'':'s'}`);inbox()});
}

function src(s){if(!s||typeof s==='string')return s?` <span class="f3">· ${esc(s)}</span>`:'';
  const u=s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\/(www\.)?/,'').slice(0,48))}</a>`:esc(s.api||s.source||s.type||'');
  return ` <span class="f3">· ${u}${s.field?` · <span class="mono">${esc(s.field)}</span>`:''}${s.record_date?` · record ${esc(s.record_date)}`:''}${s.retrieved_at?` · retrieved ${esc(s.retrieved_at)}`:''}</span>${s.passage?`<span class="q">“${esc(String(s.passage).slice(0,220))}”</span>`:''}`}

/* The bill read from the photo, Indian GST invoice layout. Every field says how sure we are:
   checked (format check, arithmetic, words or Jev agree) · read · computed · invalid (shown as printed) · conflict (rules and Jev differ). */
const MK={checked:'✓ checked',read:'read',computed:'computed',invalid:'✗ invalid',conflict:'⚠ compare with photo'};
function billCard(x,v){
  const b=x.bill;
  if(!b){const F=x.scan.fields||{};return `<div class="billcard"><div class="lbl">Bill made from your photo</div><h3>${esc(v.legal_name||x.vendor_name_text||'Vendor not read')}</h3><div class="bc-amt">${x.amount_inr?inr(x.amount_inr):'not read'}</div></div>`}
  const F=b.fields, val=k=>F[k]?F[k].value:null;
  const mark=k=>{const f=F[k];if(!f)return '';const lo=f.conf<0.5&&f.status!=='computed'&&f.status!=='invalid';
    return `<span class="mk ${lo?'conflict':f.status}" title="${esc(f.how||'')}${f.jev?' · Jev '+esc(f.jev):''}">${lo?'⚠ low confidence':MK[f.status]||f.status}${f.jev==='agrees'?' · Jev ✓':''}</span>`
      +(f.note&&(f.status==='invalid'||f.status==='conflict')?`<div class="fnote ${f.status==='invalid'?'bad':''}">${esc(f.note)}</div>`:'')};
  const show=(k,fmt)=>{const x0=val(k);return x0==null||x0===''?'<span class="miss">not printed</span>':esc(fmt?fmt(x0):x0)};
  const d=iso=>{if(!iso)return iso;const t=new Date(iso+'T00:00:00');return isNaN(t)?iso:t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
  const row=(l,k,fmt)=>`<div><dt>${l}</dt><dd class="${val(k)==null?'miss':''}">${show(k,fmt)}${mark(k)}</dd></div>`;
  const party=(title,role)=>{const has=F[role+'.name']||F[role+'.gstin'];if(!has&&role!=='seller')return '';
    return `<div class="bc-party"><div class="lbl">${title}</div><b>${show(role+'.name')}</b>${mark(role+'.name')}
      <div class="f3 mono" style="margin-top:4px">GSTIN ${show(role+'.gstin')}${mark(role+'.gstin')}</div>
      ${F[role+'.state']?`<div class="f3">State ${esc(val(role+'.state'))}</div>`:''}</div>`};
  const money=n=>n==null?'—':inr(n);
  const taxes=['cgst','sgst','utgst','igst','cess'].filter(k=>F[k]);
  const it=b.items||[];
  const DOC={tax_invoice:'Tax invoice',invoice:'Invoice',bill_of_supply:'Bill of supply',credit_note:'Credit note',debit_note:'Debit note',proforma:'Proforma invoice',quotation:'Quotation',delivery_challan:'Delivery challan',receipt:'Receipt',unknown:'Document'};
  return `<div class="billcard">
   <div class="bc-h"><div><div class="lbl">Bill made from your photo · ${esc(DOC[b.doc_type]||b.doc_type)}</div><h3>${show('seller.name')}</h3>${mark('seller.name')}</div>
    <div style="text-align:right"><div class="lbl">Total</div><div class="bc-amt">${F.total?inr(val('total')):'not read'}</div>${mark('total')}</div></div>
   ${b.readable===false?`<div class="fnote bad" style="font-size:14px;margin-bottom:8px">${esc(b.quality_note||'Could not read this bill.')}</div>`:''}
   <div class="bc-parties">${party('Seller (supplier)','seller')}${party('Buyer (bill to)','buyer')}${party('Consignee (ship to)','consignee')}</div>
   <div class="bc-sec">Invoice</div>
   <dl class="bc-grid">${row('Invoice no','invoice_no')}${row('Invoice date','invoice_date',d)}${F.due_date?row('Due date','due_date',d):''}${F.place_of_supply?row('Place of supply','place_of_supply'):''}
    ${F.po_no?row('Buyer order / PO','po_no'):''}${F.irn?row('IRN (e-invoice)','irn'):''}${F.ack_no?row('Ack no','ack_no'):''}${F.ack_date?row('Ack date','ack_date',d):''}${F.eway_bill?row('E-way bill','eway_bill'):''}</dl>
   ${it.length?`<div class="bc-sec">Items</div><div style="overflow-x:auto"><table class="bc-items"><thead><tr><th>Description</th><th>HSN/SAC</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
    ${it.map(i=>`<tr><td>${esc(i.description||'—')}</td><td class="mono">${esc(i.hsn||'—')}</td><td class="r">${i.qty!=null?esc(i.qty)+(i.unit?' '+esc(i.unit):''):'—'}</td><td class="r">${money(i.rate)}</td><td class="r">${money(i.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}
   <div class="bc-sec">Tax and total</div>
   <div class="bc-sum">
    ${F.taxable_value?`<span>Taxable value ${mark('taxable_value')}</span><span class="r">${money(val('taxable_value'))}</span>`:''}
    ${taxes.map(k=>`<span>${k.toUpperCase()}${F[k+'_rate']?' @ '+esc(val(k+'_rate'))+'%':''} ${mark(k)}</span><span class="r">${money(val(k))}</span>`).join('')}
    ${F.round_off?`<span>Round off</span><span class="r">${money(val('round_off'))}</span>`:''}
    <span class="t">Total ${mark('total')}</span><span class="r t">${F.total?money(val('total')):'not read'}</span>
    ${F.total_in_words?`<span class="f3" style="grid-column:1/-1">In words: ${money(val('total_in_words'))} (${esc(F.total_in_words.printed||'')})</span>`:''}
   </div>
   ${F['bank.account_no']||F['bank.ifsc']||F['bank.upi']?`<div class="bc-sec">Bank</div><dl class="bc-grid">${row('Account holder','bank.account_holder')}${row('Account no','bank.account_no')}${row('IFSC','bank.ifsc')}
     ${F['bank.name']?row('Bank','bank.name'):''}${F['bank.branch']?row('Branch','bank.branch'):''}${F['bank.upi']?row('UPI ID','bank.upi'):''}</dl>`:''}
   ${b.checks&&b.checks.length?`<div class="bc-sec">Checks on the bill itself</div><ul class="bc-checks">${b.checks.map(c=>`<li><span class="${c.ok?'ok':'no'}">${c.ok?'✓':'✗'}</span><span><b>${esc(nice(c.name))}</b> · ${esc(c.detail)}</span></li>`).join('')}</ul>`:''}
   <div class="f3" style="margin-top:12px">Read on this machine in ${x.scan.read_ms} ms · ₹0 · ${b.jev?'Jev: '+esc(b.jev)+' · ':''}<a href="#" onclick="event.preventDefault();document.getElementById('ph').scrollIntoView({behavior:'smooth'})">see the photo and where each field came from</a></div></div>`}
async function caseView(key){
  topbar(`<span class="mono">${esc(key)}</span>`,{crumb:'<a id="bk">Inbox</a>'});$('#bk').onclick=()=>go('inbox');
  V.innerHTML='<div style="padding:24px">'+skel(4)+'</div>';
  const c=await api('/api/invoices/'+encodeURIComponent(key)), d=c.decision, x=c.extracted, t=d.trust_report, s=c.invoice.state, v=c.vendor||{};
  const can=s==='awaiting_approval', canRe=s==='held';
  const head={paid:'Paid once',awaiting_approval:'Ready to pay. Waiting for your approval',held:'Held for a person',duplicate:'Duplicate. Not paid',rejected:'Not payable',approved:'Approved. Paying now'}[s]||nice(s);
  const ev=e=>e.claim?`<div class="e"><b>${esc(e.claim)}:</b> ${esc(e.value)}${src(e.source)}</div>`:`<div class="e">${esc(e.source)} · ${esc(e.field)}: <span class="mono">${esc(e.value)}</span>${e.verified_on?` · verified ${esc(e.verified_on)}`:''}</div>`;
  const vv=t?(t.verdict==='CLEAR'?'pass':t.verdict==='HOLD'?'warn':'fail'):null;
  V.innerHTML=`<div class="case"><div class="body">
    <div class="banner ${s}"><span class="st ${s}">${ICON[s]||ICON.none}</span><div><h2>${head}</h2><p>${esc(d.reason)}</p>
      ${c.payment?`<p class="mono" style="margin-top:8px">${inr(c.payment.amount_inr)} → ${esc(c.payment.payee)} · a/c ${esc(c.payment.account)} · ref <span class="copy" data-copy="${esc(c.payment.ref)}">${esc(c.payment.ref)}</span> · approved by ${esc(c.payment.approved_by)}</p>`:''}</div></div>
    ${can?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><button class="hold" id="hold"><i class="fill"></i><span id="holdl">Hold to approve and pay ${inr(x.amount_inr)}</span></button><span class="f3">Press and hold for a second. Recorded as <b class="f2">${esc(ME&&ME.name||'AP lead')}</b>.</span></div>`:''}
    ${x.scan?billCard(x,v):''}
    ${canRe?`<button class="btn" id="re">Replay checks</button>`:''}
    <div class="sec"><span class="lbl">Checks</span><span class="f3">${d.checks.filter(k=>k.result==='pass').length} of ${d.checks.length} passed</span></div>
    <div class="rail">${d.checks.map(k=>`<details class="chk" ${k.result!=='pass'?'open':''}><summary><span class="dot">${ICON[k.result]||ICON.none}</span><span class="name">${esc(chkName(k.check))}</span><span class="why">${esc(k.reasoning)}</span>${(k.evidence||[]).length?`<span class="chev">›</span>`:''}</summary>
      ${(k.evidence||[]).length?`<div class="evi">${k.evidence.slice(0,14).map(ev).join('')}</div>`:''}</details>`).join('')}</div>
    ${t?`<div class="sec"><span class="lbl">Vendor check</span>${pill(vv,nice(t.verdict).toLowerCase())}<span class="f3">${t.screening.hits_found} news results · ${t.screening.hits_cleared} namesakes cleared · ${t.screening.hits_escalated} escalated</span></div>
      ${t.flags.map(f=>`<div class="chk"><div style="display:flex;gap:10px"><span>${ICON[f.severity==='red'?'fail':'warn']}</span><span>${esc(f.reason)}${src(f.source)}</span></div></div>`).join('')}
      ${t.cannot_verify.map(m=>`<div class="chk"><div style="display:flex;gap:10px"><span>${ICON.none}</span><span class="f2">Cannot verify: ${esc(m)}</span></div></div>`).join('')}`:''}
    ${d.draft_message?`<div class="sec"><span class="lbl">Drafted message · not sent</span></div><div class="draft"><div class="f2">To <b>${esc(d.draft_message.to)}</b> · call back <span class="mono">${esc(d.draft_message.phone_to_call_back||'—')}</span></div><pre>${esc(d.draft_message.subject+'\n\n'+d.draft_message.body)}</pre><div class="f3" style="margin-top:8px">${esc(d.draft_message.note)}</div><div style="margin-top:10px"><span class="btn sm" data-copy="${esc(d.draft_message.subject+'\n\n'+d.draft_message.body)}">Copy draft</span></div></div>`:''}
    ${x.scan?`<div class="sec"><span class="lbl">Scanned bill</span><span class="f3">read by ${esc(nice(x.scan.reader))} on this machine in ${x.scan.read_ms} ms · ₹0 · <span class="mono">${esc(x.scan.photo)}</span></span></div>
    <div class="scangrid"><div class="scanph"><img id="ph" alt="Photo of the bill">${Object.entries(x.scan.fields).map(([k,f])=>f.boxes.map(b=>`<i title="${esc(nice(k))}" style="left:${b[0]*100}%;top:${b[1]*100}%;width:${b[2]*100}%;height:${b[3]*100}%"></i>`).join('')).join('')}</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Field</th><th>Read as</th><th>From the photo</th></tr></thead><tbody>${Object.entries(x.scan.fields).map(([k,f])=>`<tr><td>${esc(nice(k))}</td><td class="mono">${esc(x[k])}</td><td class="f2">row ${f.row} · confidence <b class="${f.conf<0.5?'warn':'pass'}">${f.conf.toFixed(2)}</b><div class="f3">“${esc(f.text)}”</div></td></tr>`).join('')}</tbody></table></div></div>`:''}
    <div class="sec"><span class="lbl">Audit trail</span></div>
    <div class="feed" style="padding:0">${c.events.map(e=>`<div class="ev"><span class="f3 mono" style="font-size:11px">${new Date(e.at*1000).toLocaleTimeString('en-IN')}</span><span class="f2">${esc(e.msg)}</span></div>`).join('')}</div>
  </div>
  <aside class="props">
    <div class="lbl" style="margin-bottom:8px">Properties</div>
    <div class="prop"><span class="k">Status</span><span class="v">${st(s)}</span></div>
    <div class="prop"><span class="k">Amount</span><span class="v mono num">${inr(x.amount_inr)}</span></div>
    <div class="prop"><span class="k">Invoice</span><span class="v mono"><span class="copy" data-copy="${esc(x.invoice_no||'')}">${esc(x.invoice_no||'—')}</span></span></div>
    <div class="prop"><span class="k">Date</span><span class="v">${esc(x.invoice_date||'—')}</span></div>
    <div class="prop"><span class="k">PO</span><span class="v mono">${esc(x.po_no||'—')}</span></div>
    <hr>
    <div class="prop"><span class="k">Vendor</span><span class="v" title="${esc(v.legal_name)}">${esc(v.legal_name||'Unknown')}</span></div>
    <div class="prop"><span class="k">Domain</span><span class="v mono">${esc(v.domain||'—')}</span></div>
    <div class="prop"><span class="k">Sent from</span><span class="v mono" title="${esc(x.sender)}">${esc(x.sender_domain||'—')}</span></div>
    <div class="prop"><span class="k">Verified a/c</span><span class="v mono">${esc(v.bank?.account_no||'—')}</span></div>
    ${t?`<div class="prop"><span class="k">Vendor check</span><span class="v">${pill(vv,nice(t.verdict).toLowerCase())}</span></div>`:''}
    <hr>
    <div class="prop"><span class="k">Risk score</span><span class="v mono">${d.risk_score??0} / 100</span></div><div class="meter"><i style="width:${d.risk_score??0}%;background:${(d.risk_score||0)>=60?'var(--bad)':(d.risk_score||0)>0?'var(--held)':'var(--paid)'}"></i></div>
    <div class="prop" style="margin-top:6px"><span class="k">Job cost</span><span class="v mono">${t?`${t.cost.credits} cr · ₹${t.cost.inr}`:'0 cr · ₹0'}</span></div>
    <div class="prop"><span class="k">Key</span><span class="v mono"><span class="copy" data-copy="${esc(key)}" title="Idempotency key: copy">${esc(key)}</span></span></div>
  </aside></div>`;
  bindCopy(V);
  if(x.scan)blobUrl('/api/scan/'+encodeURIComponent(x.scan.photo)).then(u=>{const i=$('#ph');if(i)i.src=u});
  if(can){const b=$('#hold');let tm=null;const label=`Hold to approve and pay ${inr(x.amount_inr)}`;
    const start=e=>{e.preventDefault();if(b.classList.contains('done'))return;b.classList.add('holding');$('#holdl').textContent='Keep holding…';
      tm=setTimeout(async()=>{b.classList.remove('holding');b.classList.add('done');$('#holdl').textContent='Approved · paying…';
        try{const r=await api('/api/approve',{key});if(r.ok){toast(`Paid ${inr(x.amount_inr)} · ref ${esc(r.ref)}`);await refreshInv();caseView(key)}else{toast(esc(r.error||'Not approved'),'err');caseView(key)}}catch(err){toast(esc(err.message),'err')}},1200)};
    const cancel=()=>{if(b.classList.contains('done'))return;clearTimeout(tm);b.classList.remove('holding');$('#holdl').textContent=label};
    b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,cancel));
    b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});b.addEventListener('keyup',cancel)}
  if(canRe)$('#re').onclick=e=>busy(e.currentTarget,'Re-running…',async()=>{const r=await api('/api/recheck',{key});toast(`Replayed: ${esc(LBL[r.before?.state]||r.before?.state)} → ${esc(LBL[r.after?.state]||r.after?.state)}`);await refreshInv();go('case',r.after?.invoice_key||key)});
}

async function approvals(){
  topbar('Approvals');V.innerHTML=skel();await refreshInv();
  const tb=(rows,empty)=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Status</th><th>Document</th><th>Vendor</th><th class="r">Amount</th><th>Reason</th><th class="r">Since</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="click rowin" style="animation-delay:${i*20}ms" data-k="${esc(r.invoice_key)}"><td>${st(r.state)}</td><td class="mono">${esc(r.invoice_no||nice(r.doc_type))}</td><td>${esc(r.vendor_id||'—')}</td><td class="r mono num">${inr(r.amount_inr)}</td><td class="f2" title="${esc(r.reason)}">${esc(r.reason||'')}</td><td class="r f3">${ago(r.updated_at)}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><b>${empty}</b></div></td></tr>`}</tbody></table></div>`;
  const w=INV.filter(r=>r.state==='awaiting_approval'),h=INV.filter(r=>r.state==='held');
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Every payment waits here for a person. Every approval is recorded with the approver's name (<span class="mono">${esc(ME&&ME.name||'AP lead')}</span>, set in Settings).</p>
   <div class="sec" style="margin-top:0"><span class="lbl">Ready to pay</span><span class="f3">${w.length}</span></div>${tb(w,'Nothing waiting for approval')}
   <div class="sec"><span class="lbl">Held: needs a decision or a call-back</span><span class="f3">${h.length}</span></div>${tb(h,'Nothing held')}`;
  $$('tr[data-k]').forEach(tr=>tr.onclick=()=>go('case',tr.dataset.k));
}

async function vendors(){
  topbar('Vendors');V.innerHTML=skel(4);const v=await api('/api/vendors');
  const vs=x=>x==='CLEAR'?'pass':x==='HOLD'?'warn':x?'fail':'none';
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">The vendor master. Only the bank account verified at onboarding is ever paid.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Vendor</th><th>Domain</th><th>GSTIN</th><th>Verified account</th><th>Check</th><th></th></tr></thead><tbody>
  ${v.map((x,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td><span class="mono f3">${esc(x.vendor_id)}</span>&nbsp; ${esc(x.legal_name)}</td><td class="mono">${esc(x.domain||'—')}</td><td class="mono">${esc(x.gstin||'—')}</td><td class="mono" title="IFSC ${esc(x.bank?.ifsc)} · verified ${esc(x.bank?.verified_on)}">${esc(x.bank?.account_no)} <span class="f3">· ${esc(x.bank?.verified_on)}</span></td>
   <td><span class="st">${ICON[vs(x.trust)]}<span class="t ${x.trust?'':'f3'}">${x.trust?esc(nice(x.trust).toLowerCase().replace(/^./,c=>c.toUpperCase())):'Not run'}</span></span></td>
   <td class="r"><button class="btn sm" data-v="${esc(x.legal_name)}" data-w="${esc(x.domain||'')}" data-d="${esc(x.director||'')}">Check now</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-v]').forEach(b=>b.onclick=()=>go('vcheck',{n:b.dataset.v,w:b.dataset.w,d:b.dataset.d}));
}

async function vcheck(pre){
  topbar('Vendor check');
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Is this a real, trading business, who runs it, how long has it existed, and is anything off. Live sources, every fact cited.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px"><input id="vn" placeholder="Vendor name" value="${esc(pre?.n||'')}" style="width:240px"><input id="vw" placeholder="Website" value="${esc(pre?.w||'')}" style="width:200px"><input id="vd" placeholder="Director (optional)" value="${esc(pre?.d||'')}" style="width:200px"><button class="btn primary" id="go">Run check</button></div><div id="out"></div>`;
  $('#go').onclick=e=>busy(e.currentTarget,'Checking live sources…',async()=>{$('#out').innerHTML=skel(5);
    try{const r=await api('/cases',{vendor_name:$('#vn').value,website:$('#vw').value,director:$('#vd').value});
    const k=r.verdict==='CLEAR'?'paid':r.verdict==='HOLD'?'held':'rejected';
    $('#out').innerHTML=`<div class="banner ${k}"><span class="st ${k}">${ICON[k]}</span><div><h2>${esc(nice(r.verdict).toLowerCase().replace(/^./,c=>c.toUpperCase()))}</h2><p>${esc(r.summary)}</p><p class="mono f3" style="margin-top:6px">${r.cost.credits} credits · ₹${r.cost.inr} · ${r.elapsed_s}s · ${r.screening.hits_cleared} namesakes cleared</p></div></div>
     <div class="tblwrap"><table class="tbl"><thead><tr><th>Fact</th><th>Value</th><th>Source</th></tr></thead><tbody>${r.facts.map((f,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td>${esc(f.claim)}</td><td class="wrap">${esc(f.value)}</td><td class="wrap f3">${src(f.source)}</td></tr>`).join('')}</tbody></table></div>
     ${r.flags.map(f=>`<div class="chk"><div style="display:flex;gap:10px">${ICON[f.severity==='red'?'fail':'warn']}<span>${esc(f.reason)}${src(f.source)}</span></div></div>`).join('')}
     ${r.cannot_verify.map(m=>`<div class="chk"><div style="display:flex;gap:10px">${ICON.none}<span class="f2">Cannot verify: ${esc(m)}</span></div></div>`).join('')}`;
    toast(`Vendor check: ${esc(nice(r.verdict).toLowerCase())}`)}catch(err){$('#out').innerHTML='';throw err}});
  if(pre?.n)$('#go').click();
}

const SAMPLE='date,description,amount\n3 Oct 2026,RAZ*SWIGGY BLR,1240\n7 Oct 2026,AWS EMEA,18500\n7 Oct 2026,AWS EMEA,18500\n9 Oct 2026,PAYTM*SHARMA TRD,4000';
async function bank(){
  topbar('Bank lines');
  const res=r=>({POSTED:'paid',HELD:'held',CANNOT_VERIFY:'rejected'}[r]||'none');
  const lab=r=>({POSTED:'Posted',HELD:'Held',CANNOT_VERIFY:'Cannot verify'}[r]||r);
  const table=rows=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Result</th><th>Date</th><th>Bank line</th><th class="r">Amount</th><th>Payee</th><th>Account</th><th>Why</th></tr></thead><tbody>${rows.map((l,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td><span class="st ${res(l.result)}">${ICON[res(l.result)]||ICON.none}<span class="t">${esc(lab(l.result))}</span></span></td><td>${esc(l.date)}</td><td class="mono">${esc(l.description)}</td><td class="r mono num">${inr(l.amount_inr)}</td><td>${esc(l.payee||'—')}</td><td>${esc(l.account||'—')}</td><td class="f2" title="${esc(l.reason)}">${esc(l.reason)}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>No lines posted yet</b>Paste a statement above.</div></td></tr>'}</tbody></table></div>`;
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Paste statement lines as CSV (date, description, amount). Each line gets a payee and ledger account, duplicates are held, and unknown payees are never guessed. Re-posting the same file posts nothing twice.</p>
   <div class="box" style="margin-bottom:20px"><div style="padding:14px;display:grid;gap:8px"><textarea id="csv">${SAMPLE}</textarea><div style="display:flex;gap:8px"><button class="btn primary" id="post">Post lines</button><button class="btn ghost" id="samp">Reset to sample</button></div></div></div>
   <div class="sec" style="margin-top:0"><span class="lbl">Posted lines</span></div><div id="bt">${skel(4)}</div>`;
  $('#bt').innerHTML=table(await api('/api/bank'));
  $('#samp').onclick=()=>$('#csv').value=SAMPLE;
  $('#post').onclick=e=>busy(e.currentTarget,'Posting…',async()=>{const r=await api('/api/bank',{csv:$('#csv').value});
    const n=k=>r.lines.filter(l=>l.result===k).length;toast(`${n('POSTED')} posted · ${n('HELD')} held · ${n('CANNOT_VERIFY')} cannot verify`);$('#bt').innerHTML=table(r.lines)});
}

async function ledger(){
  topbar('Ledger');V.innerHTML=skel();const p=await api('/api/payments');
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Simulated payment rails. One row per invoice: the idempotency key is the primary key, so a retry, restart or second approval cannot add a row.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Paid</th><th>Payee</th><th>Account</th><th class="r">Amount</th><th>Approved by</th><th>Reference</th><th>Idempotency key</th></tr></thead><tbody>
  ${p.map((r,i)=>`<tr class="rowin" style="animation-delay:${i*20}ms"><td class="f2" title="${tsf(r.paid_at)}">${ago(r.paid_at)}</td><td>${esc(r.payee)}</td><td class="mono" title="IFSC ${esc(r.ifsc)}">${esc(r.account)}</td><td class="r mono num">${inr(r.amount_inr)}</td><td class="mono">${esc(r.approved_by)}</td><td class="mono"><span class="copy" data-copy="${esc(r.ref)}">${esc(r.ref)}</span></td><td class="mono f3"><span class="copy" data-copy="${esc(r.idempotency_key)}">${esc(r.idempotency_key)}</span></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>No payments yet</b>Approve a ready invoice to pay it.</div></td></tr>'}</tbody>
  <tfoot><tr><td colspan="3">Total paid</td><td class="r mono num">${inr(p.reduce((a,r)=>a+r.amount_inr,0))}</td><td colspan="3" class="f3">${p.length} payment${p.length===1?'':'s'}</td></tr></tfoot></table></div>`;
  bindCopy(V);
}

async function activity(){
  topbar('Activity');V.innerHTML=skel(10);const e=await api('/api/events');
  V.innerHTML=`<div class="chips"><input class="search" id="aq" placeholder="Filter events…" style="margin-left:0"></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Time</th><th>Job</th><th>Event</th></tr></thead><tbody id="at"></tbody></table></div>`;
  const draw=q=>{$('#at').innerHTML=e.filter(r=>!q||(r.msg+(r.job_id||'')).toLowerCase().includes(q)).map(r=>`<tr><td class="mono f3">${tsf(r.at)}</td><td class="mono">${esc(r.job_id||'—')}</td><td style="${r.level==='error'?'color:var(--bad)':r.level==='warn'?'color:var(--held)':''}" title="${esc(r.msg)}">${esc(r.msg)}</td></tr>`).join('')};
  draw('');$('#aq').oninput=x=>draw(x.target.value.toLowerCase());
}

async function settings(){
  topbar('Settings');const s=await api('/api/settings');
  const f=[['max_credits_per_job','Cost limit per job','Crustdata credits. A job that reaches it stops and says cannot verify.'],['max_seconds_per_job','Time limit per job','Seconds.'],['auto_approve_below_inr','Auto-approve payments below','₹. 0 means every payment needs a person.'],['min_age_years','Flag companies younger than','Years.'],['min_headcount','Flag headcount below','People.'],['min_read_confidence','Hold a scanned bill when a field is read below','Confidence, 0 to 1. A person compares that field with the photo.']];
  V.innerHTML=`<p class="f2" style="margin:0 0 16px">Limits and approval policy for every run. Changes apply to the next job and are written to the activity log.</p>
  <div style="max-width:640px"><div class="field"><div><div class="h">Approver name</div><div class="d">Recorded on every payment you approve.</div></div><input id="s_approver_name" value="${esc(s.approver_name||'AP lead')}"></div>${f.map(([k,l,d])=>`<div class="field"><div><div class="h">${l}</div><div class="d">${d}</div></div><input id="s_${k}" class="num" value="${esc(s[k])}"></div>`).join('')}
  <div style="margin-top:16px"><button class="btn primary" id="save">Save settings</button></div></div>`;
  $('#save').onclick=e=>busy(e.currentTarget,'Saving…',async()=>{const b={approver_name:$('#s_approver_name').value};f.forEach(([k])=>b[k]=$('#s_'+k).value);await api('/api/settings',b);ME={name:b.approver_name};$('#who').textContent=b.approver_name;$('#av').textContent=(b.approver_name||'A')[0].toUpperCase();toast('Settings saved')});
}

/* ============ command palette + keyboard ============ */
let PI=0,PL=[];
function palOpen(){$('#pal').classList.add('on');$('#pq').value='';PI=0;palDraw();setTimeout(()=>$('#pq').focus(),0)}
function palClose(){$('#pal').classList.remove('on')}
function palDraw(){const q=$('#pq').value.toLowerCase();
  const items=[...SCREENS.map(s=>({g:'Go to',t:s.t,k:'g '+s.k,run:()=>go(s.id)})),
    {g:'Actions',t:'Process inbox',run:async()=>{const r=await api('/api/process',{});toast(`Processed ${r.length} documents`);go('inbox')}},
    {g:'Actions',t:'Post bank lines',run:()=>go('bank')},{g:'Actions',t:'Run a vendor check',run:()=>go('vcheck')},
    ...INV.map(r=>({g:'Documents',t:`${r.invoice_no||nice(r.doc_type)} · ${r.vendor_id||''} · ${LBL[r.state]||r.state}`,run:()=>go('case',r.invoice_key)}))];
  PL=items.filter(i=>!q||i.t.toLowerCase().includes(q)).slice(0,30);PI=Math.min(PI,Math.max(0,PL.length-1));let g='';
  $('#pres').innerHTML=PL.map((i,n)=>{const h=i.g!==g?`<div class="gh lbl">${i.g}</div>`:'';g=i.g;return h+`<div class="it ${n===PI?'on':''}" data-n="${n}">${esc(i.t)}${i.k?`<span class="k kbd">${i.k}</span>`:''}</div>`}).join('')||'<div class="empty">No matches</div>';
  $$('#pres .it').forEach(el=>{el.onclick=()=>{palClose();PL[+el.dataset.n].run()};el.onmouseenter=()=>{PI=+el.dataset.n;$$('#pres .it').forEach(x=>x.classList.toggle('on',x===el))}})}
$('#pq').oninput=()=>{PI=0;palDraw()};
$('#pal').onclick=e=>{if(e.target.id==='pal')palClose()};
$('#kopen').onclick=palOpen;
let gKey=false;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').classList.contains('on')?palClose():palOpen();return}
  if($('#pal').classList.contains('on')){if(e.key==='Escape')palClose();
    if(e.key==='ArrowDown'){PI=Math.min(PI+1,PL.length-1);palDraw();e.preventDefault()}if(e.key==='ArrowUp'){PI=Math.max(PI-1,0);palDraw();e.preventDefault()}
    if(e.key==='Enter'&&PL[PI]){palClose();PL[PI].run()}return}
  if(typing){if(e.key==='Escape')document.activeElement.blur();return}
  if(gKey){gKey=false;const sc=SCREENS.find(x=>x.k===e.key);if(sc){go(sc.id);e.preventDefault()}return}
  if(e.key==='g'){gKey=true;setTimeout(()=>gKey=false,900);return}
  if(e.key==='Escape'&&ROUTE.id==='case'){go('inbox');return}
  if(ROUTE.id==='inbox'){const rows=$$('#tb tr[data-k]');
    const mv=n=>{SEL=Math.max(0,Math.min(rows.length-1,SEL+n));rows.forEach((r,i)=>r.classList.toggle('sel',i===SEL));rows[SEL]?.scrollIntoView({block:'nearest'});e.preventDefault()};
    if(e.key==='j'||e.key==='ArrowDown')mv(1);if(e.key==='k'||e.key==='ArrowUp')mv(-1);
    if(e.key==='Enter'&&rows[SEL])go('case',rows[SEL].dataset.k);
    if(e.key==='/'){$('#q')?.focus();e.preventDefault()}}
});

/* ============ boot ============ */
$('#setme').onclick=()=>go('settings');
(async()=>{
  try{
    ME=await api('/api/me');const nm=ME&&ME.name||'AP lead';$('#who').textContent=nm;$('#av').textContent=nm[0].toUpperCase();
    await refreshInv();
    const h=decodeURIComponent(location.hash.slice(1));
    if(h.startsWith('case-'))go('case',h.slice(5));else go(SCREENS.some(s=>s.id===h)?h:'dash');
  }catch(e){V.innerHTML=`<div class="empty"><b>Could not start</b>${esc(e.message)}</div>`}
})();
</script>
